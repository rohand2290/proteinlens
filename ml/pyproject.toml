[project]
name = "proteinlens-ml"
version = "0.1.0"
description = "ProteinLens ML plane: evaluation harnesses, training and serving"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "networkx>=3.3",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "markov-clustering>=0.0.6.dev0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pl-eval = "proteinlens_ml.eval.cli:main"
pl-benchmark = "proteinlens_ml.data.benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["proteinlens_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
prerelease = "allow"
